apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  # 'name' must match this filename (inventory.yaml) and defines the
  # kubectl subcommand: kubectl inventory
  name: inventory
spec:
  version: v0.1.0
  homepage: https://github.com/shahneil76/kubectl-inventory
  shortDescription: Complete namespace resource inventory and analysis
  description: |
    Scans every API resource in a namespace — including all CRDs — and
    classifies them by ownership, references, GitOps signals, and stuck
    finalizers.

    Detects suspicious orphan resources, dangling ownerReferences,
    stuck finalizers, and ArgoCD/Helm/Flux managed objects.

    Uses a metadata-first scan (PartialObjectMetadataList) that is
    ~10x faster than kubectl get all or ketall on large clusters.

    Usage:
      kubectl inventory -n my-namespace
      kubectl inventory explain pod/my-pod -n my-namespace
      kubectl inventory orphans -n my-namespace
      kubectl inventory stuck -n my-namespace
  caveats: |
    This plugin is read-only: it only calls List/Get against the
    Kubernetes API. No cluster-side installation required.
  platforms:
    # Linux amd64
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_linux_amd64.tar.gz
      sha256: f5a10efa6c5865c92abb672439a5913cb96fea1e36f4e5e51a52407c1454bafb
      files:
        - from: kubectl-inventory
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory

    # Linux arm64
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_linux_arm64.tar.gz
      sha256: 0c882dd94b2ee0c9052917cf7e72f8a8f1c309a302763695951d21aa34b486b4
      files:
        - from: kubectl-inventory
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory

    # macOS amd64 (Intel)
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_darwin_amd64.tar.gz
      sha256: 8dd142c31a54c1b183a81ad081b639d8f250e17e7c733b1f1565d5b450aac810
      files:
        - from: kubectl-inventory
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory

    # macOS arm64 (Apple Silicon)
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_darwin_arm64.tar.gz
      sha256: 9f9f824b85ddb8e565b4590e7ee6acf0f3508149ec62f60723b52e555705c0aa
      files:
        - from: kubectl-inventory
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory

    # Windows amd64
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_windows_amd64.zip
      sha256: c1d21e8d59b8e42440fa276f66caab7119bd951ab04dbc7fa1b74891e2beae6e
      files:
        - from: kubectl-inventory.exe
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory.exe

    # Windows arm64
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/shahneil76/kubectl-inventory/releases/download/v0.1.0/kubectl-inventory_0.1.0_windows_arm64.zip
      sha256: 3876f4528d608b9a381903a49788eec1c7e9a07e052411edf6baec39a1d90295
      files:
        - from: kubectl-inventory.exe
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-inventory.exe
